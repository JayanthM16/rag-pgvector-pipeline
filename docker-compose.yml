services:
  vectordb:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      retries: 10

  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    depends_on:
      vectordb:
        condition: service_healthy
    ports: ["8080:8080"]
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project
      PG_DSN: postgresql://rag:rag@vectordb:5432/rag
      DOCS_DIR: /opt/airflow/project/data/docs
      EVAL_FILE: /opt/airflow/project/eval/questions.jsonl
      FASTEMBED_CACHE: /opt/airflow/project/.cache/fastembed
    volumes:
      - ./dags:/opt/airflow/dags
      - .:/opt/airflow/project
    command: standalone

volumes:
  pgdata:
